<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Arrowzle: Escape the Grid — a clean, challenging bent-arrow escape puzzle.">
<title>Arrowzle: Escape the Grid</title>
<style>
:root{color-scheme:light;--navy:#101b50;--blue:#148ee3;--blue-soft:#dcefff;--muted:#7d8799;--pale:#f2f5f9;--red:#f33454}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#171b2b;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.app{width:min(100%,720px);min-height:100svh;margin:0 auto;padding:clamp(12px,2.3vh,24px) clamp(15px,4vw,30px) max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.brand{font-size:10px;font-weight:950;letter-spacing:.25em;color:var(--blue);margin:0 0 7px}
h1{font-size:clamp(28px,5vw,38px);line-height:1.12;letter-spacing:-.045em;text-align:center;color:#333b56;margin:0;font-weight:880}
.subhead{font-size:12px;color:#8b93a4;text-align:center;margin:7px 0 17px}
.levelbar{width:100%;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;margin-bottom:12px}
.levelbar button{width:44px;height:44px;border:0;background:#fff;color:var(--blue);border-radius:50%;font-size:29px;cursor:pointer;display:grid;place-items:center}
.levelno{text-align:center;font-size:18px;font-weight:780;color:#171b2a}
.levelno small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9aa2af;font-weight:900;margin-bottom:3px}
.status{width:100%;display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:8px;margin-bottom:5px}
.pill{height:43px;border-radius:13px;background:#f1f5f9;color:#5c6578;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 9px;font-size:14px;font-weight:720;white-space:nowrap}
.arrow-count{justify-self:start;min-width:88px}
.arrow-mini{color:#53617c;font-size:19px}
.difficulty{justify-self:end;min-width:90px;font-weight:680}
.hearts{display:flex;justify-content:center;align-items:center;gap:clamp(7px,2vw,14px);font-size:clamp(23px,4vw,31px);line-height:1}
.heart{color:var(--red);filter:drop-shadow(0 2px 1px #f3315220);transition:transform .15s,opacity .15s}
.heart.lost{color:#e3e6ec;filter:none}
.board-area{width:100%;display:flex;justify-content:center;align-items:center;flex:1;min-height:280px;margin:0 auto}
.board-frame{width:min(100%,590px);aspect-ratio:1;position:relative;display:grid;place-items:center;touch-action:manipulation}
svg#puzzle{display:block;width:100%;height:100%;overflow:visible}
.grid-dots circle{fill:#c8cbd0;transition:opacity .2s}
#puzzle.dots-hidden .grid-dots{opacity:0}
.arrow-group{cursor:pointer;outline:none}.arrow-group.animating{pointer-events:none}
.arrow-group .visible{fill:none;stroke:var(--navy);stroke-width:9.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s,filter .15s}
.arrow-group .hit{fill:none;stroke:transparent;stroke-width:34;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke}
.arrow-group .glow{fill:none;stroke:#70c2ff;stroke-width:24;stroke-linecap:round;stroke-linejoin:round;opacity:0;pointer-events:none}
.arrow-group .runner{fill:none;stroke:#168fe5;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26 2000;stroke-dashoffset:0;opacity:0;filter:drop-shadow(0 0 7px #168fe5cc);pointer-events:none}
.arrow-group.hinted .visible{stroke:var(--blue);filter:drop-shadow(0 0 4px #168fe577)}
.arrow-group.hinted .glow{opacity:.42}
.arrow-group.blocked .visible{stroke:#e64d63;filter:drop-shadow(0 0 3px #e64d6370)}
.arrow-group.clearing{opacity:0;transform:translate(var(--exit-x),var(--exit-y)) scale(.96);pointer-events:none}
.arrow-group:focus-visible .visible{stroke:var(--blue);filter:drop-shadow(0 0 3px #168fe577)}
.bottom-controls{display:flex;justify-content:center;align-items:center;gap:clamp(26px,8vw,55px);padding:7px 0 2px}
.round-action{position:relative;width:94px;height:94px;border-radius:50%;border:2.5px solid var(--blue);color:var(--blue);background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 16px #168fe51b;transition:transform .15s,box-shadow .15s}
.round-action.secondary{width:80px;height:80px;border:0;box-shadow:0 5px 18px #14244818;color:var(--blue)}
.round-action:active{transform:scale(.96)}
.round-action:disabled{opacity:.4;cursor:not-allowed}
.round-action svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.round-action.secondary svg{width:34px;height:34px}
.count-badge{position:absolute;right:-4px;top:-9px;min-width:31px;height:31px;border-radius:20px;padding:0 8px;background:var(--blue);color:#fff;font-weight:900;font-size:16px;display:grid;place-items:center;border:3px solid #fff}
.action-label{font-size:10px;letter-spacing:.15em;font-weight:900;color:#8791a4;text-align:center;margin-top:8px}
.control-wrap{display:flex;flex-direction:column;align-items:center}
.hint-note{font-size:11px;color:#9aa2b1;text-align:center;margin:12px 0 0}
.status-foot{font-size:10px;color:#a2a9b7;text-align:center;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.overlay{position:fixed;inset:0;z-index:10;background:#ffffffed;display:none;align-items:center;justify-content:center;padding:22px}
.overlay.show{display:flex}
.modal{width:min(100%,450px);text-align:center;padding:28px 23px;border-radius:26px;background:#fff;box-shadow:0 15px 55px #10214a19;border:1px solid #edf1f6;animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal h2{font-size:28px;color:#343c56;letter-spacing:-.04em;margin:0 0 9px}
.modal p{color:#7f899b;font-size:13px;line-height:1.65;margin:0 0 18px}
.modal .eyeline{color:var(--blue);font-weight:950;font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
.modal-stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:16px 0 20px}
.modal-stat{padding:10px 13px;border-radius:12px;background:#f2f6fa;color:#68738a;font-size:11px}
.modal-stat strong{display:block;color:var(--navy);font-size:18px;margin-top:3px}
.modal-actions{display:grid;gap:10px}
.modal-btn{height:52px;border-radius:99px;border:1px solid #e8edf3;background:#fff;color:#2187d2;font-weight:850;cursor:pointer}
.modal-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 6px 18px #168fe52b}
.win-overlay{background:radial-gradient(circle at center,#31b8ff 0,#0788ec 54%,#066ed0 100%);color:#fff;overflow:hidden}
.win-overlay:before{content:"";position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 45%,#ffffff0d 0deg 7deg,transparent 7deg 16deg);animation:spin 45s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.win-overlay .modal{position:relative;background:transparent;border:0;box-shadow:none;color:#fff}
.win-overlay .modal h2,.win-overlay .modal p,.win-overlay .modal .eyeline{color:#fff}
.win-overlay .modal .eyeline{font-size:12px}
.win-overlay .modal h2{font-size:clamp(30px,7vw,42px)}
.win-overlay .modal-stat{background:#ffffffed}
.win-overlay .modal-btn{background:#fff;color:#1686d6;border:0}
.win-overlay .modal-btn.primary{background:#fff;color:#1686d6}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:17px;background:#ffda52;animation:fall 3.4s linear infinite}
.confetti i:nth-child(3n){background:#ff7ab5}.confetti i:nth-child(4n){background:#8bffb2}.confetti i:nth-child(5n){background:#fff}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(min-width:760px){.app{padding-top:28px}.board-area{max-height:650px}.board-frame{width:min(62vh,590px)}}
@media(max-height:760px){.app{padding-top:8px;padding-bottom:10px}.brand{margin-bottom:3px}.subhead{margin:4px 0 8px}.levelbar{margin-bottom:6px}.board-frame{width:min(100%,50vh)}.board-area{min-height:230px}.round-action{width:80px;height:80px}.round-action.secondary{width:69px;height:69px}.bottom-controls{gap:27px}.hint-note{margin-top:6px}}
@media(max-width:380px){.pill{font-size:12px;height:39px}.arrow-count{min-width:73px}.difficulty{min-width:76px}.hearts{gap:6px}.board-area{min-height:235px}.round-action{width:83px;height:83px}}
</style>
</head>
<body>
<main class="app">
  <div class="brand">ARROWZLE · ESCAPE THE GRID</div>
  <h1 id="headline">Tap Away Arrows</h1>
  <p class="subhead">Find the free path. Clear every arrow.</p>
  <div class="levelbar">
    <button id="backBtn" aria-label="Main menu">‹</button>
    <div class="levelno"><small>PUZZLE</small><span id="levelLabel">Level 1</span></div>
    <button id="settingsBtn" aria-label="Settings">⚙</button>
  </div>
  <section class="status" aria-label="Game status">
    <div class="pill arrow-count"><span class="arrow-mini">➤</span><span id="arrowCount">0</span></div>
    <div class="hearts" id="hearts" aria-label="Three lives"><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span></div>
    <div class="pill difficulty" id="difficulty">Easy</div>
  </section>
  <section class="board-area">
    <div class="board-frame">
      <svg id="puzzle" viewBox="0 0 600 600" role="group" aria-label="Bent arrow puzzle board">
        <defs>
          <marker id="tip-navy" viewBox="0 0 20 20" markerWidth="20" markerHeight="20" refX="16" refY="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L20 10 L0 20 Z" fill="#101b50"/></marker>
          <marker id="tip-blue" viewBox="0 0 20 20" markerWidth="20" markerHeight="20" refX="16" refY="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L20 10 L0 20 Z" fill="#148ee3"/></marker>
          <marker id="tip-red" viewBox="0 0 20 20" markerWidth="20" markerHeight="20" refX="16" refY="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L20 10 L0 20 Z" fill="#e64d63"/></marker>
        </defs>
        <g class="grid-dots" id="dots"></g>
        <g id="arrows"></g>
      </svg>
    </div>
  </section>
  <div class="bottom-controls">
    <div class="control-wrap">
      <button class="round-action" id="hintBtn" aria-label="Use hint">
        <span class="count-badge" id="hintCount">2</span>
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 29c-2-2.1-3.2-5-3.2-8.1a11.2 11.2 0 1 1 22.4 0c0 3.1-1.2 6-3.2 8.1-1.8 1.8-2.8 3.1-2.8 5H18.8c0-1.9-1-3.2-2.8-5Z"/><path d="M19 39h10M20 34h8M24 13v7m-5.5-1.5 3.4 3.4m10.1-3.4-3.4 3.4"/></svg>
      </button>
      <div class="action-label">HINT</div>
    </div>
    <div class="control-wrap">
      <button class="round-action secondary" id="gridBtn" aria-label="Toggle guide dots" aria-pressed="true">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M15 7v34M32 7v34M7 16h34M7 32h34"/></svg>
      </button>
      <div class="action-label">GRID</div>
    </div>
  </div>
  <p class="hint-note">Tap an arrow when its exit path is clear.</p>
  <div class="status-foot"><span id="timerLabel">TIME 02:30</span> &nbsp;·&nbsp; <span id="moveLabel">0 MOVES</span></div>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="confetti" id="confetti" hidden></div>
  <section class="modal">
    <div class="eyeline" id="modalEyeline">ARROWZLE</div>
    <h2 id="modalTitle">Ready?</h2>
    <p id="modalText"></p>
    <div class="modal-stats" id="modalStats"></div>
    <div class="modal-actions" id="modalActions"></div>
  </section>
</div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg",KEY="arrowzle-save-v1";
const DIRS=[[-1,0],[0,1],[1,0],[0,-1]];
let save={};try{save=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}
let level=Math.max(1,Number(save.level)||1),best=Number(save.best)||0,wins=Number(save.wins)||0,soundOn=save.sound!==false;
let arrows=[],gridSize=12,lives=3,hints=2,moves=0,timeLeft=180,mode="level",finished=false,animating=false,timer=null,audio=null,hinted=null,score=0;
const key=(r,c)=>r+","+c;
function rngFrom(seed){let s=seed>>>0;return()=>{s+=0x6D2B79F5;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function saveProgress(){try{localStorage.setItem(KEY,JSON.stringify({level,best,wins,sound:soundOn}))}catch(e){}}
function tone(f,d=.12,type="sine",v=.04){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();if(audio.state==="suspended")audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function sfx(k){if(k==="clear"){tone(620);setTimeout(()=>tone(880,.14),65)}if(k==="bad")tone(170,.2,"triangle",.05);if(k==="hint")tone(750);if(k==="win")[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2),i*95))}
function rayCells(path,dir){const end=path[path.length-1],out=[];let r=end.r+DIRS[dir][0],c=end.c+DIRS[dir][1];while(r>=0&&c>=0&&r<gridSize&&c<gridSize){out.push(key(r,c));r+=DIRS[dir][0];c+=DIRS[dir][1]}return out}
function countTurns(path){let t=0;for(let i=2;i<path.length;i++){const a=path[i-1],b=path[i],p=path[i-2];if(b.r-a.r!==a.r-p.r||b.c-a.c!==a.c-p.c)t++}return t}
function buildCandidate(occupied,placed,rng){
  let bestCandidate=null,bestValue=-Infinity;
  for(let attempt=0;attempt<850;attempt++){
    let r=Math.floor(rng()*gridSize),c=Math.floor(rng()*gridSize);
    if(occupied.has(key(r,c)))continue;
    const path=[{r,c}],own=new Set([key(r,c)]),segmentCount=2+Math.floor(rng()*2);
    let lastDir=-1,valid=true;
    for(let segment=0;segment<segmentCount;segment++){
      const choices=lastDir<0?[0,1,2,3]:[(lastDir+1)%4,(lastDir+3)%4];
      const d=choices[Math.floor(rng()*choices.length)],length=1+Math.floor(rng()*4);
      for(let step=0;step<length;step++){
        const nr=r+DIRS[d][0],nc=c+DIRS[d][1],k=key(nr,nc);
        if(nr<0||nc<0||nr>=gridSize||nc>=gridSize||occupied.has(k)||own.has(k)){valid=false;break}
        r=nr;c=nc;path.push({r,c});own.add(k);
      }
      if(!valid)break;
      lastDir=d;
    }
    if(!valid||path.length<4||rayCells(path,lastDir).some(k=>occupied.has(k)||own.has(k)))continue;
    let blockers=0;
    for(const old of placed){const ray=new Set(rayCells(old.path,old.dir));if(path.some(p=>ray.has(key(p.r,p.c))))blockers++}
    const turns=countTurns(path),value=turns*2.7+blockers*4.2+path.length*.18+rng();
    if(value>bestValue){bestValue=value;bestCandidate={path,dir:lastDir}}
  }
  return bestCandidate;
}
function generatePuzzle(n,seed,target){
  gridSize=n;const rng=rngFrom(seed),occupied=new Set(),placed=[];
  for(let i=0;i<target;i++){
    const candidate=buildCandidate(occupied,placed,rng);
    if(!candidate)break;
    const arrow={id:"arrow-"+i,path:candidate.path,dir:candidate.dir,cleared:false};
    placed.push(arrow);candidate.path.forEach(p=>occupied.add(key(p.r,p.c)));
  }
  return placed;
}
function canExit(arrow){
  const occupied=new Set();
  for(const other of arrows){if(other===arrow||other.cleared)continue;for(const p of other.path)occupied.add(key(p.r,p.c))}
  return rayCells(arrow.path,arrow.dir).every(k=>!occupied.has(k));
}
function difficulty(){return level<8?"Easy":level<25?"Normal":"Hard"}
function coord(p){const pad=47,step=(600-pad*2)/(gridSize-1);return{x:pad+p.c*step,y:pad+p.r*step}}
function el(name,attrs){const node=document.createElementNS(NS,name);Object.entries(attrs||{}).forEach(([k,v])=>node.setAttribute(k,String(v)));return node}
function drawBoard(){
  const dots=$("dots"),layer=$("arrows");dots.innerHTML="";layer.innerHTML="";
  const occupied=new Set();for(const a of arrows)if(!a.cleared)for(const p of a.path)occupied.add(key(p.r,p.c));
  for(let r=0;r<gridSize;r++)for(let c=0;c<gridSize;c++){if(occupied.has(key(r,c)))continue;const p=coord({r,c});dots.appendChild(el("circle",{cx:p.x,cy:p.y,r:3.1}))}
  for(const arrow of arrows){
    if(arrow.cleared)continue;
    const group=el("g",{class:"arrow-group",tabindex:"0",role:"button","aria-label":canExit(arrow)?"Bent arrow. Exit clear. Tap to remove.":"Bent arrow. Exit blocked. Tap to try."});
    group.dataset.id=arrow.id;
    if(hinted===arrow.id)group.classList.add("hinted");
    if(arrow.flash)group.classList.add("blocked");
    const d=arrow.path.map((p,i)=>{const q=coord(p);return(i?"L":"M")+q.x+" "+q.y}).join(" ");
    const glow=el("path",{class:"glow",d});
    const visible=el("path",{class:"visible",d,"marker-end":hinted===arrow.id?"url(#tip-blue)":arrow.flash?"url(#tip-red)":"url(#tip-navy)"});
    const hit=el("path",{class:"hit",d});
    const runner=el("path",{class:"runner",d});
    group.append(glow,visible,runner,hit);
    group.addEventListener("click",()=>tapArrow(arrow.id,group));
    group.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tapArrow(arrow.id,group)}});
    layer.appendChild(group);
  }
  updateHud();
}
function updateHud(){
  $("levelLabel").textContent=mode==="daily"?"Daily":("Level "+level);
  $("arrowCount").textContent=arrows.filter(a=>!a.cleared).length;
  $("difficulty").textContent=mode==="daily"?"Daily":difficulty();
  $("hearts").innerHTML=[0,1,2].map(i=>'<span class="heart '+(i>=lives?'lost':'')+'">♥</span>').join("");
  $("hearts").setAttribute("aria-label",lives+" lives remaining");
  $("hintCount").textContent=hints;$("hintBtn").disabled=hints<=0||finished||animating;
  $("moveLabel").textContent=moves+" MOVES";
  $("timerLabel").textContent="TIME "+String(Math.floor(timeLeft/60)).padStart(2,"0")+":"+String(timeLeft%60).padStart(2,"0");
}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(finished)return;timeLeft=Math.max(0,timeLeft-1);updateHud();if(timeLeft===0)finish(false,"Time is up. Restart and look for the paths with a clear exit.")},1000)}
function setup(modeName="level",fixedSeed=null){
  clearInterval(timer);mode=modeName;finished=false;animating=false;hinted=null;
  const n=mode==="daily"?13:Math.min(15,12+Math.floor((level-1)/18));
  const target=mode==="daily"?17:Math.min(22,n+2+Math.floor(level/15));
  const seed=fixedSeed===null?((Math.random()*4294967295)>>>0):fixedSeed;
  arrows=generatePuzzle(n,seed,target);
  if(arrows.length<6)arrows=generatePuzzle(n,seed+7919,Math.max(7,target-3));
  lives=3;hints=2;moves=0;score=0;timeLeft=mode==="daily"?270:Math.max(105,220-(n-12)*14);
  $("overlay").classList.remove("show","win-overlay");$("confetti").hidden=true;
  $("headline").textContent=mode==="daily"?"Daily Arrow Challenge":"Tap Away Arrows";
  drawBoard();startTimer();
}
function tapArrow(id,group){
  if(finished||animating)return;
  const arrow=arrows.find(a=>a.id===id);if(!arrow||arrow.cleared)return;
  if(!canExit(arrow)){
    lives=Math.max(0,lives-1);arrow.flash=true;sfx("bad");if(group)group.classList.add("blocked");updateHud();
    setTimeout(()=>{arrow.flash=false;if(group)group.classList.remove("blocked")},340);
    if(lives===0)finish(false,"You ran out of hearts. Try again and clear the arrows blocking the exits first.");return;
  }

  // A bright snake-head travels along the complete bent path first.
  // Once it reaches the arrowhead, the body retracts behind it.
  const visible=group&&group.querySelector(".visible");
  const runner=group&&group.querySelector(".runner");
  if(!visible||!runner||typeof runner.animate!=="function"){
    arrow.cleared=true;moves++;score+=10+Math.min(timeLeft,90);hinted=null;sfx("clear");
    drawBoard();
    if(arrows.every(a=>a.cleared))finish(true,"Every bent arrow has escaped. Beautifully done!");
    return;
  }

  animating=true;
  group.classList.add("animating");
  const pathLength=visible.getTotalLength();
  const snakeLength=Math.max(22,Math.min(38,pathLength*.2));
  const travelDuration=Math.max(750,Math.min(1550,pathLength*3.8));
  runner.style.strokeDasharray=snakeLength+" "+(pathLength*2);
  runner.style.strokeDashoffset="0";
  runner.style.opacity="1";

  const travel=runner.animate(
    [{strokeDashoffset:"0"},{strokeDashoffset:String(-pathLength)}],
    {duration:travelDuration,easing:"linear",fill:"forwards"}
  );
  travel.onfinish=()=>{
    // The moving segment reaches the tip; the rest of the arrow follows it out.
    visible.setAttribute("marker-end","none");
    visible.style.strokeDasharray=pathLength+" "+pathLength;
    const retractDuration=Math.max(340,Math.min(680,pathLength*1.55));
    const retract=visible.animate(
      [{strokeDashoffset:"0",opacity:1},{strokeDashoffset:String(pathLength),opacity:0}],
      {duration:retractDuration,easing:"ease-in",fill:"forwards"}
    );
    runner.animate([{opacity:1},{opacity:0}],{duration:retractDuration,easing:"ease-out",fill:"forwards"});
    retract.onfinish=()=>{
      arrow.cleared=true;moves++;score+=10+Math.min(timeLeft,90);hinted=null;animating=false;sfx("clear");
      drawBoard();
      if(arrows.every(a=>a.cleared))finish(true,"Every bent arrow has escaped. Beautifully done!");
    };
  };
}
function useHint(){
  if(finished||hints<=0)return;
  const choices=arrows.filter(a=>!a.cleared&&canExit(a));if(!choices.length)return;
  const selected=choices[Math.floor(Math.random()*choices.length)];hints--;hinted=selected.id;sfx("hint");drawBoard();
}
function setStats(items){const box=$("modalStats");box.innerHTML="";items.forEach(([label,value])=>{const node=document.createElement("div");node.className="modal-stat";node.textContent=label;const strong=document.createElement("strong");strong.textContent=String(value);node.appendChild(strong);box.appendChild(node)})}
function setActions(items){const box=$("modalActions");box.innerHTML="";items.forEach(([label,action,primary])=>{const b=document.createElement("button");b.className="modal-btn"+(primary?" primary":"");b.textContent=label;b.onclick=()=>{if(action==="next")setup("level");else if(action==="retry")setup(mode);else if(action==="main")showMain();else if(action==="daily")setup("daily",hash("arrowzle-daily-"+today()));else closeModal()};box.appendChild(b)})}
function closeModal(){$("overlay").classList.remove("show","win-overlay");$("confetti").hidden=true;finished=false;startTimer()}
function finish(won,message){
  if(finished)return;finished=true;clearInterval(timer);
  if(won){
    const earned=score+lives*50+timeLeft*2;best=Math.max(best,earned);wins++;if(mode==="level")level++;saveProgress();sfx("win");
    $("overlay").classList.add("win-overlay");$("confetti").hidden=false;createConfetti();
    $("modalEyeline").textContent="TRAIN YOUR BRAIN";$("modalTitle").textContent="Level Completed!";$("modalText").textContent=message;
    setStats([["SCORE",earned],["MOVES",moves],["TIME LEFT",timeLeft+"s"]]);
    setActions([["New Game","next",true],["Main","main",false]]);
  }else{
    $("overlay").classList.remove("win-overlay");$("confetti").hidden=true;
    $("modalEyeline").textContent="TRY AGAIN";$("modalTitle").textContent="Keep Going!";$("modalText").textContent=message;
    setStats([["ARROWS LEFT",arrows.filter(a=>!a.cleared).length],["MOVES",moves],["BEST",best]]);
    setActions([["Retry puzzle","retry",true],["Main menu","main",false]]);
  }
  $("overlay").classList.add("show");
}
function createConfetti(){const c=$("confetti");c.innerHTML="";for(let i=0;i<52;i++){const bit=document.createElement("i");bit.style.left=(Math.random()*100)+"%";bit.style.animationDelay=(Math.random()*3)+"s";bit.style.animationDuration=(2.4+Math.random()*2)+"s";c.appendChild(bit)}}
function openModal(title,text,actions,stats=[]){$("overlay").classList.remove("win-overlay");$("confetti").hidden=true;$("modalEyeline").textContent="ARROWZLE";$("modalTitle").textContent=title;$("modalText").textContent=text;setStats(stats);setActions(actions);$("overlay").classList.add("show")}
function showMain(){
  clearInterval(timer);finished=true;
  openModal("Arrowzle","Choose how you want to play.",[["Continue level","continue",true],["Daily challenge","daily",false],["Restart level","retry",false],["Close","close",false]],[["CURRENT LEVEL",level],["BEST SCORE",best],["PUZZLES CLEARED",wins]]);
  const b=$("modalActions").querySelectorAll("button");
  b[0].onclick=()=>setup("level");b[1].onclick=()=>setup("daily",hash("arrowzle-daily-"+today()));b[2].onclick=()=>setup(mode);b[3].onclick=closeModal;
}
function showSettings(){
  openModal("Settings","Choose an option.",[[soundOn?"Sound: On":"Sound: Off","sound",true],["How to play","help",false],["Restart puzzle","retry",false],["Daily challenge","daily",false],["Close","close",false]],[["LEVEL",mode==="daily"?"Daily":level],["HINTS",hints],["LIVES",lives]]);
  const b=$("modalActions").querySelectorAll("button");
  b[0].onclick=()=>{soundOn=!soundOn;saveProgress();showSettings()};
  b[1].onclick=showHelp;b[2].onclick=()=>setup(mode);b[3].onclick=()=>setup("daily",hash("arrowzle-daily-"+today()));b[4].onclick=closeModal;
}
function showHelp(){
  openModal("How to play","Each arrow is one continuous, bent path. Its arrowhead shows the exit direction. Tap the path only when the straight lane in front of its arrowhead is clear all the way to the edge. Clear blocking paths first. You have three hearts and two hints.",[["Got it","close",true]],[["TIP","Look for an arrow with an open lane."],["HINTS",hints+" left"]]);
  $("modalActions").querySelector("button").onclick=closeModal;
}
$("hintBtn").addEventListener("click",useHint);
$("gridBtn").addEventListener("click",()=>{$("puzzle").classList.toggle("dots-hidden");$("gridBtn").setAttribute("aria-pressed",String(!$("puzzle").classList.contains("dots-hidden")))});
$("settingsBtn").addEventListener("click",showSettings);
$("backBtn").addEventListener("click",showMain);
setup("level");
})();
</script>
</body>
