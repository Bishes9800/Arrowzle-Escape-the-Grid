<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Arrowzle: Escape the Grid — tap away bent arrows and clear the board.">
<title>Arrowzle: Escape the Grid</title>
<style>
:root{color-scheme:light;--ink:#101b50;--blue:#138fe4;--blue2:#0878ce;--muted:#68718a;--pale:#f0f4f9;--line:#e7ecf3;--heart:#f33152}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#151a2b;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #168fe5;outline-offset:3px}
.app{width:min(100%,700px);min-height:100svh;margin:0 auto;padding:clamp(13px,2.6vh,25px) clamp(16px,4vw,30px) max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.brand{font-size:11px;font-weight:950;letter-spacing:.24em;color:#168fe5;margin:0 0 7px}
h1{font-size:clamp(28px,5vw,37px);line-height:1.13;letter-spacing:-.045em;text-align:center;color:#333b56;margin:0;font-weight:850}
.subhead{font-size:12px;color:#8b93a4;text-align:center;margin:7px 0 17px}
.levelbar{width:100%;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;margin-bottom:13px}
.levelbar button{width:43px;height:43px;border:0;background:white;color:var(--blue);border-radius:50%;font-size:29px;cursor:pointer;display:grid;place-items:center}
.levelno{text-align:center;font-size:18px;font-weight:750;color:#171b2a}
.levelno small{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#a0a7b5;font-weight:850;margin-bottom:3px}
.status{width:100%;display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:8px;margin-bottom:6px}
.pill{height:43px;border-radius:13px;background:#f1f5f9;color:#5c6578;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 9px;font-size:14px;font-weight:700;white-space:nowrap}
.arrow-count{justify-self:start;min-width:88px}
.arrow-mini{color:#526079;font-size:20px;line-height:1}
.difficulty{justify-self:end;min-width:90px;font-weight:650}
.hearts{display:flex;justify-content:center;align-items:center;gap:clamp(7px,2vw,14px);font-size:clamp(23px,4vw,31px);line-height:1}
.heart{color:var(--heart);filter:drop-shadow(0 2px 1px #f3315220);transition:transform .15s,opacity .15s}
.heart.lost{color:#e3e6ec;filter:none}
.board-area{width:100%;display:flex;justify-content:center;align-items:center;flex:1;min-height:270px;margin:0 auto}
.board-frame{width:min(100%,550px);aspect-ratio:1;position:relative;display:grid;place-items:center;touch-action:manipulation}
svg#puzzle{display:block;width:100%;height:100%;overflow:visible}
.grid-dots circle{fill:#cbd0d8;transition:opacity .2s}
#puzzle.dots-hidden .grid-dots{opacity:0}
.arrow-group{cursor:pointer;outline:none;transition:opacity .18s,filter .18s}
.arrow-group .visible{fill:none;stroke:var(--ink);stroke-width:8.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s,filter .15s}
.arrow-group .hit{fill:none;stroke:transparent;stroke-width:28;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke}
.arrow-group.hinted .visible{stroke:var(--blue);filter:drop-shadow(0 0 4px #168fe577)}
.arrow-group.blocked .visible{stroke:#e64d63;filter:drop-shadow(0 0 3px #e64d6370)}
.arrow-group.clearing{opacity:0;transform:scale(.96);transform-origin:center;pointer-events:none}
.arrow-group:focus-visible .visible{stroke:var(--blue);filter:drop-shadow(0 0 3px #168fe577)}
.bottom-controls{display:flex;justify-content:center;align-items:center;gap:clamp(26px,8vw,55px);padding:8px 0 2px}
.round-action{position:relative;width:93px;height:93px;border-radius:50%;border:2.5px solid #138fe4;color:#138fe4;background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 16px #168fe51b;transition:transform .15s,box-shadow .15s}
.round-action.secondary{width:79px;height:79px;border:0;box-shadow:0 5px 18px #14244818;color:#168fe5}
.round-action:active{transform:scale(.96)}
.round-action:disabled{opacity:.4;cursor:not-allowed}
.round-action svg{width:39px;height:39px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.round-action.secondary svg{width:34px;height:34px}
.count-badge{position:absolute;right:-4px;top:-9px;min-width:31px;height:31px;border-radius:20px;padding:0 8px;background:#168fe5;color:white;font-weight:850;font-size:16px;display:grid;place-items:center;border:3px solid white}
.action-label{font-size:10px;letter-spacing:.15em;font-weight:900;color:#8791a4;text-align:center;margin-top:8px}
.control-wrap{display:flex;flex-direction:column;align-items:center}
.hint-note{font-size:11px;color:#9aa2b1;text-align:center;margin:13px 0 0}
.status-foot{font-size:10px;color:#a2a9b7;text-align:center;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.overlay{position:fixed;inset:0;z-index:10;background:#ffffffed;display:none;align-items:center;justify-content:center;padding:22px}
.overlay.show{display:flex}
.modal{width:min(100%,450px);text-align:center;padding:28px 23px;border-radius:26px;background:white;box-shadow:0 15px 55px #10214a19;border:1px solid #edf1f6;animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal h2{font-size:28px;color:#343c56;letter-spacing:-.04em;margin:0 0 9px}
.modal p{color:#7f899b;font-size:13px;line-height:1.65;margin:0 0 18px}
.modal .eyeline{color:var(--blue);font-weight:950;font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
.modal-stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:16px 0 20px}
.modal-stat{padding:10px 13px;border-radius:12px;background:#f2f6fa;color:#68738a;font-size:11px}
.modal-stat strong{display:block;color:var(--ink);font-size:18px;margin-top:3px}
.modal-actions{display:grid;gap:10px}
.modal-btn{height:52px;border-radius:99px;border:1px solid #e8edf3;background:#fff;color:#2187d2;font-weight:850;cursor:pointer}
.modal-btn.primary{background:#168fe5;color:white;border-color:#168fe5;box-shadow:0 6px 18px #168fe52b}
.win-overlay{background:radial-gradient(circle at center,#31b8ff 0,#0788ec 54%,#066ed0 100%);color:white;overflow:hidden}
.win-overlay:before{content:"";position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 45%,#ffffff0d 0deg 7deg,transparent 7deg 16deg);animation:spin 45s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.win-overlay .modal{position:relative;background:transparent;border:0;box-shadow:none;color:white}
.win-overlay .modal h2,.win-overlay .modal p,.win-overlay .modal .eyeline{color:white}
.win-overlay .modal .eyeline{font-size:12px}
.win-overlay .modal h2{font-size:clamp(30px,7vw,42px)}
.win-overlay .modal-stat{background:#ffffffed}
.win-overlay .modal-btn{background:white;color:#1686d6;border:0}
.win-overlay .modal-btn.primary{background:white;color:#1686d6}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:17px;background:#ffda52;animation:fall 3.4s linear infinite}
.confetti i:nth-child(3n){background:#ff7ab5}.confetti i:nth-child(4n){background:#8bffb2}.confetti i:nth-child(5n){background:#fff}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(min-width:760px){.app{padding-top:28px}.board-area{max-height:600px}.board-frame{width:min(55vh,550px)}}
@media(max-height:760px){.app{padding-top:9px;padding-bottom:12px}.brand{margin-bottom:3px}.subhead{margin:4px 0 9px}.levelbar{margin-bottom:7px}.board-frame{width:min(100%,47vh)}.board-area{min-height:220px}.round-action{width:79px;height:79px}.round-action.secondary{width:68px;height:68px}.bottom-controls{gap:27px}.hint-note{margin-top:6px}}
@media(max-width:380px){.pill{font-size:12px;height:39px}.arrow-count{min-width:73px}.difficulty{min-width:76px}.hearts{gap:6px}.board-area{min-height:235px}.round-action{width:83px;height:83px}}
</style>
</head>
<body>
<main class="app">
  <div class="brand">ARROWZLE · ESCAPE THE GRID</div>
  <h1 id="headline">Tap Away Arrows</h1>
  <p class="subhead">Find the free path. Clear every arrow.</p>

  <div class="levelbar">
    <button id="backBtn" aria-label="Main menu" title="Main menu">‹</button>
    <div class="levelno"><small>PUZZLE</small><span id="levelLabel">Level 1</span></div>
    <button id="settingsBtn" aria-label="Settings" title="Settings">⚙</button>
  </div>

  <section class="status" aria-label="Game status">
    <div class="pill arrow-count"><span class="arrow-mini">➤</span><span id="arrowCount">0</span></div>
    <div class="hearts" id="hearts" aria-label="Three lives"><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span></div>
    <div class="pill difficulty" id="difficulty">Easy</div>
  </section>

  <section class="board-area">
    <div class="board-frame">
      <svg id="puzzle" viewBox="0 0 440 440" role="group" aria-label="Arrow path puzzle board">
        <defs>
          <marker id="tip-navy" viewBox="0 0 16 16" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#101b50"/></marker>
          <marker id="tip-blue" viewBox="0 0 16 16" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#138fe4"/></marker>
          <marker id="tip-red" viewBox="0 0 16 16" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#e64d63"/></marker>
        </defs>
        <g class="grid-dots" id="dots"></g>
        <g id="arrows"></g>
      </svg>
    </div>
  </section>

  <div class="bottom-controls">
    <div class="control-wrap">
      <button class="round-action" id="hintBtn" aria-label="Use hint">
        <span class="count-badge" id="hintCount">2</span>
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 29c-2-2.1-3.2-5-3.2-8.1a11.2 11.2 0 1 1 22.4 0c0 3.1-1.2 6-3.2 8.1-1.8 1.8-2.8 3.1-2.8 5H18.8c0-1.9-1-3.2-2.8-5Z"/><path d="M19 39h10M20 34h8M24 13v7m-5.5-1.5 3.4 3.4m10.1-3.4-3.4 3.4"/></svg>
      </button>
      <div class="action-label">HINT</div>
    </div>
    <div class="control-wrap">
      <button class="round-action secondary" id="gridBtn" aria-label="Toggle guide dots" aria-pressed="true">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M15 7v34M32 7v34M7 16h34M7 32h34"/></svg>
      </button>
      <div class="action-label">GRID</div>
    </div>
  </div>
  <p class="hint-note">Tap an arrow when its exit path is clear.</p>
  <div class="status-foot"><span id="timerLabel">TIME 02:30</span> &nbsp;·&nbsp; <span id="moveLabel">0 MOVES</span></div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="confetti" id="confetti" hidden></div>
  <section class="modal">
    <div class="eyeline" id="modalEyeline">ARROWZLE</div>
    <h2 id="modalTitle">Ready?</h2>
    <p id="modalText"></p>
    <div class="modal-stats" id="modalStats"></div>
    <div class="modal-actions" id="modalActions"></div>
  </section>
</div>

<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
const KEY="arrowzle-save-v1";
const DIRS=[{r:-1,c:0},{r:0,c:1},{r:1,c:0},{r:0,c:-1}];
let save={};try{save=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}
let level=Math.max(1,Number(save.level)||1),best=Number(save.best)||0,wins=Number(save.wins)||0,soundOn=save.sound!==false;
let arrows=[],gridSize=8,lives=3,hints=2,moves=0,timeLeft=150,mode="level",finished=false,timer=null,audio=null,hinted=null,score=0,dailyKey="";
const randFrom=seed=>{let s=seed>>>0;return()=>{s+=0x6D2B79F5;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}};
const key=(r,c)=>r+","+c;
function saveProgress(){try{localStorage.setItem(KEY,JSON.stringify({level,best,wins,sound:soundOn}))}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function tone(f,d=.12,type="sine",v=.04){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();if(audio.state==="suspended")audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function sfx(k){if(k==="clear"){tone(620);setTimeout(()=>tone(880,.14),65)}if(k==="bad")tone(170,.2,"triangle",.05);if(k==="hint")tone(750);if(k==="win")[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2),i*95))}
function pointFromId(id){return {r:Math.floor(id/gridSize),c:id%gridSize}}
function getRayCells(path,dir){const end=path[path.length-1],out=[];let r=end.r+dir.r,c=end.c+dir.c;while(r>=0&&c>=0&&r<gridSize&&c<gridSize){out.push(key(r,c));r+=dir.r;c+=dir.c}return out}
function rayIsFree(path,dir,occupied,own){for(const k of getRayCells(path,dir))if(occupied.has(k)||own.has(k))return false;return true}
function countTurns(path){let t=0;for(let i=2;i<path.length;i++){const a=path[i-1],b=path[i],p=path[i-2];if(b.r-a.r!==a.r-p.r||b.c-a.c!==a.c-p.c)t++}return t}
function buildCandidate(n,occupied,placed,rng){
  let bestCandidate=null,bestValue=-Infinity;
  for(let attempt=0;attempt<430;attempt++){
    const start={r:Math.floor(rng()*n),c:Math.floor(rng()*n)};
    if(occupied.has(key(start.r,start.c)))continue;
    const path=[start],own=new Set([key(start.r,start.c)]);
    const desired=4+Math.floor(rng()*5);
    let lastDir=-1;
    for(let step=1;step<desired;step++){
      const prev=path[path.length-1];
      let opts=DIRS.map((d,i)=>({d,i,r:prev.r+d.r,c:prev.c+d.c})).filter(x=>x.r>=0&&x.c>=0&&x.r<n&&x.c<n&&!occupied.has(key(x.r,x.c))&&!own.has(key(x.r,x.c)));
      if(!opts.length)break;
      let turnOpts=opts.filter(x=>x.i!==lastDir);
      if(turnOpts.length&&rng()<.67)opts=turnOpts;
      const chosen=opts[Math.floor(rng()*opts.length)];
      path.push({r:chosen.r,c:chosen.c});own.add(key(chosen.r,chosen.c));lastDir=chosen.i;
    }
    if(path.length<4)continue;
    const prev=path[path.length-2],end=path[path.length-1];
    const dir=DIRS.findIndex(d=>end.r-prev.r===d.r&&end.c-prev.c===d.c);
    if(dir<0||!rayIsFree(path,DIRS[dir],occupied,own))continue;
    let blockers=0;
    for(const old of placed){const ray=new Set(getRayCells(old.path,old.dir));if(path.some(p=>ray.has(key(p.r,p.c))))blockers++}
    const turns=countTurns(path);
    const value=turns*2.2+blockers*3.7+path.length*.18+rng()*.8;
    if(value>bestValue){bestValue=value;bestCandidate={path,dir}}
  }
  return bestCandidate;
}
function generatePuzzle(n,seed,target){
  gridSize=n;const rng=randFrom(seed),occupied=new Set(),placed=[];
  for(let i=0;i<target;i++){
    const candidate=buildCandidate(n,occupied,placed,rng);
    if(!candidate)break;
    const arrow={id:"a"+i,path:candidate.path,dir:candidate.dir,cleared:false};
    placed.push(arrow);
    candidate.path.forEach(p=>occupied.add(key(p.r,p.c)));
  }
  return placed;
}
function canExit(arrow){
  const blockers=new Set();
  for(const other of arrows){if(other===arrow||other.cleared)continue;for(const p of other.path)blockers.add(key(p.r,p.c))}
  return getRayCells(arrow.path,DIRS[arrow.dir]).every(k=>!blockers.has(k));
}
function difficultyLabel(){return level<11?"Easy":level<36?"Normal":"Hard"}
function pointsFor(n){const span=360/(n-1),pad=40;return {x:pad,span}}
function coord(p){const g=pointsFor(gridSize);return {x:g.x+p.c*g.span,y:g.x+p.r*g.span}}
function svgEl(name,attrs){const el=document.createElementNS(NS,name);Object.entries(attrs||{}).forEach(([k,v])=>el.setAttribute(k,String(v)));return el}
function drawBoard(){
  const dots=$("dots"),layer=$("arrows"),g=pointsFor(gridSize);
  dots.innerHTML="";layer.innerHTML="";
  for(let r=0;r<gridSize;r++)for(let c=0;c<gridSize;c++){const p=coord({r,c});dots.appendChild(svgEl("circle",{cx:p.x,cy:p.y,r:2.8}))}
  for(const arrow of arrows){
    if(arrow.cleared)continue;
    const group=svgEl("g",{class:"arrow-group",tabindex:"0",role:"button","aria-label":canExit(arrow)?"Arrow path. Exit is clear. Tap to clear.":"Arrow path. Exit is blocked. Tap to try."});
    group.dataset.id=arrow.id;
    if(hinted===arrow.id)group.classList.add("hinted");
    if(arrow.flash)group.classList.add("blocked");
    const d=arrow.path.map((p,i)=>{const q=coord(p);return (i?"L":"M")+q.x+" "+q.y}).join(" ");
    const visible=svgEl("path",{class:"visible",d,"marker-end":hinted===arrow.id?"url(#tip-blue)":arrow.flash?"url(#tip-red)":"url(#tip-navy)"});
    const hit=svgEl("path",{class:"hit",d});
    group.append(visible,hit);
    group.addEventListener("click",()=>tapArrow(arrow.id,group));
    group.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tapArrow(arrow.id,group)}});
    layer.appendChild(group);
  }
  $("puzzle").setAttribute("aria-label",gridSize+" by "+gridSize+" arrow path puzzle");
  updateHud();
}
function updateHud(){
  const left=arrows.filter(a=>!a.cleared).length;
  $("levelLabel").textContent=mode==="daily"?"Daily":("Level "+level);
  $("arrowCount").textContent=left;
  $("difficulty").textContent=mode==="daily"?"Daily":difficultyLabel();
  $("hearts").innerHTML=[0,1,2].map(i=>'<span class="heart '+(i>=lives?'lost':'')+'">♥</span>').join("");
  $("hearts").setAttribute("aria-label",lives+" lives remaining");
  $("hintCount").textContent=hints;
  $("hintBtn").disabled=hints<=0||finished;
  $("moveLabel").textContent=moves+" MOVES";
  $("timerLabel").textContent="TIME "+String(Math.floor(timeLeft/60)).padStart(2,"0")+":"+String(timeLeft%60).padStart(2,"0");
}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(finished)return;timeLeft=Math.max(0,timeLeft-1);updateHud();if(timeLeft===0)finish(false,"Time is up. Take another run and find the free path.")},1000)}
function setup(modeName="level",fixedSeed=null){
  mode=modeName;finished=false;hinted=null;const n=mode==="daily"?9:Math.min(8+Math.floor((level-1)/12),11);
  const target=mode==="daily"?14:Math.min(8+Math.floor((level-1)/5),Math.floor(n*n/5.6));
  const seed=fixedSeed===null?((Math.random()*4294967295)>>>0):fixedSeed;
  arrows=generatePuzzle(n,seed,target);
  if(arrows.length<4){arrows=generatePuzzle(n,seed+7919,Math.max(5,target-2))}
  lives=3;hints=2;moves=0;score=0;timeLeft=mode==="daily"?240:Math.max(95,210-(n-8)*18);
  $("overlay").classList.remove("show");$("overlay").classList.remove("win-overlay");
  $("headline").textContent=mode==="daily"?"Daily Arrow Challenge":"Tap Away Arrows";
  drawBoard();startTimer();
}
function tapArrow(id,group){
  if(finished)return;
  const arrow=arrows.find(a=>a.id===id);if(!arrow||arrow.cleared)return;
  if(!canExit(arrow)){
    lives=Math.max(0,lives-1);arrow.flash=true;sfx("bad");
    if(group)group.classList.add("blocked");
    updateHud();setTimeout(()=>{arrow.flash=false;if(group)group.classList.remove("blocked");},330);
    if(lives===0)finish(false,"You ran out of hearts. Restart the puzzle and clear the arrows blocking the exits first.");
    return;
  }
  arrow.cleared=true;moves++;score+=10+Math.min(timeLeft,90);
  if(group){group.classList.add("clearing")}
  sfx("clear");hinted=null;
  const left=arrows.filter(a=>!a.cleared).length;
  updateHud();
  setTimeout(()=>{drawBoard();if(left===0)finish(true,"All paths are clear. Your next puzzle is ready!");},160);
}
function useHint(){
  if(finished||hints<=0)return;
  const choices=arrows.filter(a=>!a.cleared&&canExit(a));
  if(!choices.length)return;
  const choice=choices[Math.floor(Math.random()*choices.length)];
  hints--;hinted=choice.id;sfx("hint");drawBoard();
}
function finish(won,message){
  if(finished)return;finished=true;clearInterval(timer);
  if(won){const earned=score+lives*50+timeLeft*2;best=Math.max(best,earned);wins++;if(mode==="level")level++;saveProgress();sfx("win");
    $("overlay").classList.add("win-overlay");$("confetti").hidden=false;
    $("modalEyeline").textContent="TRAIN YOUR BRAIN";
    $("modalTitle").textContent="Level Completed!";
    $("modalText").textContent=message;
    setStats([["SCORE",earned],["MOVES",moves],["TIME LEFT",timeLeft+"s"]]);
    setActions([["New Game","next",true],["Main","main",false]]);
  }else{
    $("overlay").classList.remove("win-overlay");$("confetti").hidden=true;
    $("modalEyeline").textContent="TRY AGAIN";
    $("modalTitle").textContent="Keep Going!";
    $("modalText").textContent=message;
    setStats([["ARROWS LEFT",arrows.filter(a=>!a.cleared).length],["MOVES",moves],["BEST",best]]);
    setActions([["Retry puzzle","retry",true],["Main menu","main",false]]);
  }
  $("overlay").classList.add("show");
}
function setStats(items){const box=$("modalStats");box.innerHTML="";items.forEach(([label,value])=>{const el=document.createElement("div");el.className="modal-stat";el.textContent=label;const strong=document.createElement("strong");strong.textContent=String(value);el.appendChild(strong);box.appendChild(el)})}
function setActions(items){const box=$("modalActions");box.innerHTML="";items.forEach(([label,action,primary])=>{const b=document.createElement("button");b.className="modal-btn"+(primary?" primary":"");b.textContent=label;b.onclick=()=>{if(action==="next"){setup("level")}else if(action==="retry"){setup(mode)}else if(action==="main"){showMain()}else $("overlay").classList.remove("show")};box.appendChild(b)})}
function openModal(title,text,actions,stats=[]){
  $("overlay").classList.remove("win-overlay");$("confetti").hidden=true;
  $("modalEyeline").textContent="ARROWZLE";
  $("modalTitle").textContent=title;$("modalText").textContent=text;
  setStats(stats);setActions(actions);$("overlay").classList.add("show");
}
function showMain(){
  clearInterval(timer);finished=true;
  openModal("Arrowzle","Choose how you want to play.",[["Continue level","continue",true],["Daily challenge","daily",false],["Restart level","retry",false],["Close","close",false]],[["CURRENT LEVEL",level],["BEST SCORE",best],["PUZZLES CLEARED",wins]]);
  const buttons=$("modalActions").querySelectorAll("button");
  buttons[0].onclick=()=>{setup("level")};
  buttons[1].onclick=()=>{const d=today();setup("daily",hash("arrowzle-daily-"+d))};
  buttons[2].onclick=()=>{setup(mode)};
  buttons[3].onclick=()=>{$("overlay").classList.remove("show");finished=false;startTimer()};
}
function showSettings(){
  openModal("Settings","Make the puzzle your own.",[[soundOn?"Sound: On":"Sound: Off","sound",true],["How to play","help",false],["Restart puzzle","retry",false],["Daily challenge","daily",false],["Close","close",false]],[["LEVEL",mode==="daily"?"Daily":level],["HINTS",hints],["LIVES",lives]]);
  const b=$("modalActions").querySelectorAll("button");
  b[0].onclick=()=>{soundOn=!soundOn;saveProgress();showSettings()};
  b[1].onclick=showHelp;
  b[2].onclick=()=>setup(mode);
  b[3].onclick=()=>setup("daily",hash("arrowzle-daily-"+today()));
  b[4].onclick=()=>{$("overlay").classList.remove("show");finished=false;startTimer()};
}
function showHelp(){
  openModal("How to play","Each arrow is one continuous path with a head at its exit. Tap it only when the straight lane in front of the arrowhead is empty all the way to the edge. Clear blocking paths first. Three hearts and two hints are yours each puzzle.",[["Got it","close",true]],[["TIP","Look for a path that can leave the board."],["HINTS",hints+" available"]]);
  $("modalActions").querySelector("button").onclick=()=>{$("overlay").classList.remove("show");finished=false;startTimer()};
}
function createConfetti(){
  const c=$("confetti");c.innerHTML="";
  for(let i=0;i<48;i++){const bit=document.createElement("i");bit.style.left=(Math.random()*100)+"%";bit.style.animationDelay=(Math.random()*3)+"s";bit.style.animationDuration=(2.4+Math.random()*2)+"s";bit.style.transform="rotate("+Math.floor(Math.random()*360)+"deg)";c.appendChild(bit)}
}
$("hintBtn").addEventListener("click",useHint);
$("gridBtn").addEventListener("click",()=>{$("puzzle").classList.toggle("dots-hidden");$("gridBtn").setAttribute("aria-pressed",String(!$("puzzle").classList.contains("dots-hidden")))});
$("settingsBtn").addEventListener("click",showSettings);
$("backBtn").addEventListener("click",showMain);
$("confetti").hidden=true;createConfetti();setup("level");
})();
</script>
</body>
